# Contrat de sandboxd — TP2.
openapi: 3.1.0
info:
  title: sandboxd
  version: 1.0.0
  summary: Des sandboxes éphémères à la demande, pilotées par HTTP.
  description: |
    sandboxd crée, pilote et détruit des sandboxes : des conteneurs Docker
    isolés et jetables, dans lesquels un opérateur ou un agent exécute des
    commandes et lit ou écrit des fichiers.
    Toutes les erreurs suivent la RFC 9457 (application/problem+json).
  contact:
    name: "Binôme : Karl JEAN / Anas Louraibi"
servers:
  - url: http://localhost:8000
    description: Développement local
tags:
  - name: sandboxes
    description: Cycle de vie des sandboxes
  - name: exec
    description: Exécution de commandes
  - name: files
    description: Lecture et écriture de fichiers
  - name: health
    description: Sondes de santé

paths:
  /v1/sandboxes:
    post:
      tags: [sandboxes]
      operationId: createSandbox
      summary: Créer une sandbox
      description: |
        Création asynchrone : la sandbox est renvoyée en pending, puis passe
        en ready ou failed. On suit son état avec l'adresse dans Location.
        Même Idempotency-Key et même corps : même réponse 202.
        Même clé avec un autre corps : 409.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SandboxCreate"
            example:
              image: python:3.12-slim
              ttl_seconds: 600
              limits: {cpus: 0.5, memory_mb: 256}
      responses:
        "202":
          description: Création acceptée (pending).
          headers:
            Location:
              description: Adresse de la sandbox.
              schema:
                type: string
                example: /v1/sandboxes/sbx-a1b2c3d4
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
              example:
                id: sbx-a1b2c3d4
                image: python:3.12-slim
                status: pending
                ttl_seconds: 600
                limits: {cpus: 0.5, memory_mb: 256}
                created_at: "2026-10-28T10:00:00Z"
                expires_at: "2026-10-28T10:10:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"

    get:
      tags: [sandboxes]
      operationId: listSandboxes
      summary: Lister les sandboxes
      description: Liste paginée, avec un filtre par état.
      parameters:
        - name: status
          in: query
          required: false
          description: Ne garder que les sandboxes dans cet état.
          schema:
            $ref: "#/components/schemas/SandboxStatus"
        - name: page_size
          in: query
          required: false
          description: Nombre maximal d'éléments par page.
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: page_token
          in: query
          required: false
          description: Le next_page_token de la page d'avant.
          schema: {type: string}
      responses:
        "200":
          description: Une page de sandboxes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SandboxList"
              example:
                items:
                  - id: sbx-a1b2c3d4
                    image: alpine:3.20
                    status: ready
                    ttl_seconds: 600
                    limits: {cpus: 1, memory_mb: 512}
                    created_at: "2026-10-28T10:00:00Z"
                    expires_at: "2026-10-28T10:10:00Z"
                next_page_token: null
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/sandboxes/{sandbox_id}:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
    get:
      tags: [sandboxes]
      operationId: getSandbox
      summary: Consulter une sandbox
      description: Renvoie l'état courant de la sandbox.
      responses:
        "200":
          description: La sandbox.
          headers:
            ETag:
              description: Version de la sandbox (pour If-Match).
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [sandboxes]
      operationId: updateSandbox
      summary: Prolonger la durée de vie d'une sandbox
      description: |
        Modifie ttl_seconds (JSON Merge Patch).
        Avec If-Match : 412 si la sandbox a changé entre-temps.
        Sandbox terminée : 409.
      parameters:
        - name: If-Match
          in: header
          required: false
          description: L'ETag reçu avec getSandbox.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/SandboxPatch"
            example:
              ttl_seconds: 1800
      responses:
        "200":
          description: La sandbox modifiée.
          headers:
            ETag:
              description: Nouvelle version.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags: [sandboxes]
      operationId: deleteSandbox
      summary: Détruire une sandbox
      description: Supprime le conteneur et la sandbox. Un 2e DELETE renvoie 404.
      responses:
        "204":
          description: Sandbox détruite.
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/sandboxes/{sandbox_id}/exec:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
    post:
      tags: [exec]
      operationId: execCommand
      summary: Exécuter une commande
      description: |
        Exécute la commande (liste d'arguments, sans shell) et renvoie le résultat.
        Si la commande échoue ou dépasse son timeout, la réponse reste 200.
        La sandbox doit être ready, sinon 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
            example:
              cmd: ["python", "-c", "print(1 + 1)"]
              timeout_seconds: 5
      responses:
        "200":
          description: Résultat de la commande.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecResult"
              example:
                exit_code: 0
                stdout: "2\n"
                stderr: ""
                duration_ms: 54
                timed_out: false
                truncated: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationError"

  /v1/sandboxes/{sandbox_id}/files:
    parameters:
      - $ref: "#/components/parameters/SandboxId"
      - $ref: "#/components/parameters/FilePath"
    get:
      tags: [files]
      operationId: readFile
      summary: Lire un fichier de /workspace
      description: |
        Renvoie le contenu du fichier.
        Dossier, chemin absolu ou .. : 400. Fichier absent : 404.
        Sandbox pas prête : 409.
      responses:
        "200":
          description: Contenu du fichier.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"

    put:
      tags: [files]
      operationId: writeFile
      summary: Écrire un fichier dans /workspace
      description: |
        Crée le fichier (201) ou le remplace (204). Le chemin est relatif à /workspace.
        Dossier, chemin absolu ou .. : 400. Dossier parent absent : 404.
        Sandbox pas prête : 409. Fichier trop gros : 413.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Fichier créé.
        "204":
          description: Fichier remplacé.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotReady"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"

  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: Le processus est-il vivant ?
      description: Ne vérifie aucune dépendance.
      responses:
        "200":
          description: Vivant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ok]}

components:
  parameters:
    SandboxId:
      name: sandbox_id
      in: path
      required: true
      description: Identifiant de la sandbox.
      schema:
        type: string
        pattern: "^sbx-[a-z0-9]{8}$"
      example: sbx-a1b2c3d4
    FilePath:
      name: path
      in: query
      required: true
      description: Chemin relatif à /workspace (ex. src/main.py).
      schema:
        type: string
        minLength: 1
        maxLength: 4096
        pattern: "^[^/]"
      example: hello.py
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Clé choisie par le client pour ne pas créer deux fois la même sandbox.
      schema:
        type: string
        minLength: 8
        maxLength: 64
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7

  schemas:
    SandboxStatus:
      type: string
      description: pending à la création, puis ready ou failed. terminated une fois expirée.
      enum: [pending, ready, failed, terminated]
    Image:
      type: string
      description: Images autorisées (liste blanche).
      enum: [python:3.12-slim, node:22-slim, alpine:3.20]
    Limits:
      type: object
      additionalProperties: false
      properties:
        cpus:
          type: number
          minimum: 0.1
          maximum: 2
          default: 1
        memory_mb:
          type: integer
          minimum: 64
          maximum: 1024
          default: 512
    Sandbox:
      type: object
      required: [id, image, status, ttl_seconds, limits, created_at, expires_at]
      properties:
        id:
          type: string
          pattern: "^sbx-[a-z0-9]{8}$"
        image:
          $ref: "#/components/schemas/Image"
        status:
          $ref: "#/components/schemas/SandboxStatus"
        ttl_seconds:
          type: integer
        limits:
          $ref: "#/components/schemas/Limits"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    SandboxCreate:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          $ref: "#/components/schemas/Image"
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 600
          description: Durée de vie en secondes.
        limits:
          $ref: "#/components/schemas/Limits"
    SandboxPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          description: Nouvelle durée de vie.
    SandboxList:
      type: object
      required: [items, next_page_token]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Sandbox"
        next_page_token:
          type: [string, "null"]
          description: null quand il n'y a plus de page.
    ExecRequest:
      type: object
      additionalProperties: false
      required: [cmd]
      properties:
        cmd:
          type: array
          minItems: 1
          items: {type: string}
          description: Commande et arguments, sans shell.
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 60
          default: 10
          description: Temps max, ensuite la commande est arrêtée.
    ExecResult:
      type: object
      required: [exit_code, stdout, stderr, duration_ms, timed_out, truncated]
      properties:
        exit_code:
          type: integer
          description: Code de sortie (137 si arrêtée par le timeout).
        stdout: {type: string}
        stderr: {type: string}
        duration_ms:
          type: integer
          minimum: 0
        timed_out:
          type: boolean
          description: Commande arrêtée car trop longue.
        truncated:
          type: boolean
          description: Sortie coupée au-delà de 1 Mo.
    Problem:
      type: object
      description: RFC 9457, Problem Details for HTTP APIs.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

  responses:
    BadRequest:
      description: Requête mal formée.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: /errors/invalid-path
            title: Bad Request
            status: 400
            detail: Le chemin ne doit pas contenir "..".
    NotFound:
      description: Sandbox ou fichier introuvable (le detail dit lequel).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          examples:
            sandbox:
              summary: Sandbox absente
              value:
                type: /errors/not-found
                title: Not Found
                status: 404
                detail: sbx-a1b2c3d4 n'existe pas.
            fichier:
              summary: Fichier absent
              value:
                type: /errors/file-not-found
                title: Not Found
                status: 404
                detail: /workspace/main.py n'existe pas.
    NotReady:
      description: La sandbox n'est pas prête, ou est terminée.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: /errors/not-ready
            title: Conflict
            status: 409
            detail: sbx-a1b2c3d4 n'est pas prête (status pending).
    IdempotencyConflict:
      description: Idempotency-Key déjà utilisée avec un autre corps.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: /errors/idempotency-conflict
            title: Conflict
            status: 409
            detail: Cette clé a déjà servi pour une autre requête.
    PreconditionFailed:
      description: La sandbox a changé depuis la lecture (If-Match).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: /errors/precondition-failed
            title: Precondition Failed
            status: 412
    PayloadTooLarge:
      description: Corps trop volumineux.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: /errors/payload-too-large
            title: Payload Too Large
            status: 413
    UnsupportedMediaType:
      description: Content-Type non accepté.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: /errors/unsupported-media-type
            title: Unsupported Media Type
            status: 415
    ValidationError:
      description: Valeur interdite (image, bornes, champ inconnu).
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
          example:
            type: /errors/validation
            title: Unprocessable Content
            status: 422
            detail: "image : valeur non autorisée."
